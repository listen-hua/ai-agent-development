name: internal-ai-agent

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_agent
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ai_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./backend/migrations/002_identity_acl.sql:/docker-entrypoint-initdb.d/002_identity_acl.sql:ro
      - ./backend/migrations/003_feishu_source_sync.sql:/docker-entrypoint-initdb.d/003_feishu_source_sync.sql:ro
      - ./backend/migrations/004_feishu_wiki_source.sql:/docker-entrypoint-initdb.d/004_feishu_wiki_source.sql:ro
      - ./backend/migrations/005_reminders.sql:/docker-entrypoint-initdb.d/005_reminders.sql:ro
      - ./backend/migrations/006_notification_rich_targets.sql:/docker-entrypoint-initdb.d/006_notification_rich_targets.sql:ro
      - ./backend/migrations/007_agent_profiles.sql:/docker-entrypoint-initdb.d/007_agent_profiles.sql:ro
      - ./backend/migrations/008_meeting_booking.sql:/docker-entrypoint-initdb.d/008_meeting_booking.sql:ro
      - ./backend/migrations/009_conversation_context.sql:/docker-entrypoint-initdb.d/009_conversation_context.sql:ro
      - ./backend/migrations/010_meeting_cleanup_delivery_fix.sql:/docker-entrypoint-initdb.d/010_meeting_cleanup_delivery_fix.sql:ro
      - ./backend/migrations/011_image_agent.sql:/docker-entrypoint-initdb.d/011_image_agent.sql:ro
      - ./backend/migrations/012_comfly_image_output_host.sql:/docker-entrypoint-initdb.d/012_comfly_image_output_host.sql:ro
      - ./backend/migrations/013_message_feedback.sql:/docker-entrypoint-initdb.d/013_message_feedback.sql:ro
      - ./backend/migrations/014_iam_identity.sql:/docker-entrypoint-initdb.d/014_iam_identity.sql:ro
      - ./backend/migrations/015_comfly_apiproxy_output_host.sql:/docker-entrypoint-initdb.d/015_comfly_apiproxy_output_host.sql:ro
      - ./backend/migrations/016_unified_permissions.sql:/docker-entrypoint-initdb.d/016_unified_permissions.sql:ro
      - ./backend/migrations/017_image_prompt_action_previews.sql:/docker-entrypoint-initdb.d/017_image_prompt_action_previews.sql:ro
      - ./backend/migrations/018_meeting_booking_drafts.sql:/docker-entrypoint-initdb.d/018_meeting_booking_drafts.sql:ro
      - ./backend/migrations/019_massage_queue.sql:/docker-entrypoint-initdb.d/019_massage_queue.sql:ro
      - ./backend/migrations/020_image_canvas_multi.sql:/docker-entrypoint-initdb.d/020_image_canvas_multi.sql:ro
      - ./backend/migrations/021_xgapi_image_output_host.sql:/docker-entrypoint-initdb.d/021_xgapi_image_output_host.sql:ro
      - ./backend/migrations/022_image_prompt_action_multi_projects.sql:/docker-entrypoint-initdb.d/022_image_prompt_action_multi_projects.sql:ro
      - ./backend/migrations/023_image_original_ratio.sql:/docker-entrypoint-initdb.d/023_image_original_ratio.sql:ro
      - ./backend/migrations/024_xgapi_apiproxy_output_host.sql:/docker-entrypoint-initdb.d/024_xgapi_apiproxy_output_host.sql:ro
      - ./backend/migrations/025_pixian_background_removal.sql:/docker-entrypoint-initdb.d/025_pixian_background_removal.sql:ro
      - ./backend/migrations/026_comfly_aiproxy_output_host.sql:/docker-entrypoint-initdb.d/026_comfly_aiproxy_output_host.sql:ro
      - ./backend/migrations/027_gpt_image_2_resolution.sql:/docker-entrypoint-initdb.d/027_gpt_image_2_resolution.sql:ro
      - ./backend/migrations/028_image_node_generation_source.sql:/docker-entrypoint-initdb.d/028_image_node_generation_source.sql:ro
      - ./backend/migrations/029_xgapi_base_url.sql:/docker-entrypoint-initdb.d/029_xgapi_base_url.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: pgvector/pgvector:pg17
    entrypoint: ["/bin/sh", "/ops/migrate.sh"]
    environment:
      PGPASSWORD: ai_agent
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./ops/migrate.sh:/ops/migrate.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me-minio-secret
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  tika:
    image: apache/tika:3.2.3.0-full
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/app/worker"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
